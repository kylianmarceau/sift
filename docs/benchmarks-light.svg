<text x="0" y="332" font-size="12" fill="#6b6a65">Apple M2, macOS 27 · Sift 0.1.0, Raycast 2.8.2 · measured 2026-10-22.</text>
<text x="0" y="349" font-size="12" fill="#6b6a65">Raycast’s file search runs on Spotlight. Method and caveats: BENCHMARKS.md.</text>
