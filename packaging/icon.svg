<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7BFF"/>
      <stop offset="0.55" stop-color="#4A45E6"/>
      <stop offset="1" stop-color="#3424B8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Body: Apple's 824 pt icon grid on a 1024 pt canvas. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  </g>
  <!-- Magnifier: lens ring, handle, and three lines that narrow like a sieve. -->
  <g filter="url(#glyphShadow)" fill="none" stroke="url(#glyph)" stroke-linecap="round">
    <circle cx="462" cy="452" r="186" stroke-width="58"/>
    <path d="M598 590 L742 734" stroke-width="74"/>
    <!-- Solid colour: a gradient on a horizontal line has a zero-height
         bounding box and would not render. -->
    <g stroke-width="40" stroke="#EEF0FF">
      <path d="M380 384 H544"/>
      <path d="M404 456 H520"/>
      <path d="M432 528 H492"/>
    </g>
  </g>
</svg>
