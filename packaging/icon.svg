<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFCF6"/>
      <stop offset="0.55" stop-color="#F5F1E7"/>
      <stop offset="1" stop-color="#E4DDCE"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FAF7EF"/>
      <stop offset="1" stop-color="#C4BBAA"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#34393D"/>
      <stop offset="0.45" stop-color="#22272B"/>
      <stop offset="1" stop-color="#121619"/>
    </linearGradient>
    <linearGradient id="keyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73797D"/>
      <stop offset="0.35" stop-color="#444A4E"/>
      <stop offset="1" stop-color="#0B0E10"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#176BFF"/>
      <stop offset="0.5" stop-color="#0752FF"/>
      <stop offset="1" stop-color="#0035D9"/>
    </linearGradient>
    <linearGradient id="blueRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84AEFF"/>
      <stop offset="0.45" stop-color="#1456EC"/>
      <stop offset="1" stop-color="#0028AC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#302A1E" flood-opacity="0.25"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#211F18" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Preserve the bundle's 824 pt icon footprint and transparent margins. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#rim)"/>
    <rect x="108" y="108" width="808" height="802" rx="179" fill="url(#body)"/>
    <rect x="114" y="114" width="796" height="790" rx="173" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
  </g>
  <!-- Sieve: three raised graphite bars narrow toward one cobalt result. -->
  <g filter="url(#glyphShadow)">
    <rect x="212" y="250" width="600" height="124" rx="62" fill="url(#keyline)"/>
    <rect x="217" y="255" width="590" height="112" rx="56" fill="url(#graphite)"/>
    <rect x="284" y="421" width="456" height="108" rx="54" fill="url(#keyline)"/>
    <rect x="289" y="426" width="446" height="96" rx="48" fill="url(#graphite)"/>
    <rect x="372" y="576" width="280" height="96" rx="48" fill="url(#keyline)"/>
    <rect x="377" y="581" width="270" height="84" rx="42" fill="url(#graphite)"/>
  </g>
  <g filter="url(#glyphShadow)">
    <rect x="457" y="719" width="110" height="110" rx="20" fill="url(#blueRim)"/>
    <rect x="462" y="724" width="100" height="98" rx="16" fill="url(#blue)"/>
  </g>
</svg>
