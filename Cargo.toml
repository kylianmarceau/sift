[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/sift-cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
repository = "https://github.com/kylianmarceau/sift"
authors = ["Kylian Dabancourt"]

[workspace.dependencies]
sift-store = { path = "crates/sift-store" }
sift-indexer = { path = "crates/sift-indexer" }
sift-search = { path = "crates/sift-search" }
sift-core = { path = "crates/sift-core" }
sift-apps = { path = "crates/sift-apps" }
sift-macos = { path = "crates/sift-macos" }
sift-watch = { path = "crates/sift-watch" }
sift-files = { path = "crates/sift-files" }
sift-state = { path = "crates/sift-state" }
sift-calc = { path = "crates/sift-calc" }

anyhow = "1.0.104"
bytemuck = "1.25"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9.11"
nucleo-matcher = "0.3.1"
plist = { version = "1.10", default-features = false }
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
block2 = "0.6.2"
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
raw-window-handle = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString", "CFUUID"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "FSEvents", "dispatch2", "libc"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
global-hotkey = "0.9.0"
futures = "0.3.31"
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
