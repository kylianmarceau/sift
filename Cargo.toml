[workspace]
resolver = "3"
members = ["crates/*"]
# default-members set once the CLI crate exists

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
sift-store = { path = "crates/sift-store" }
sift-indexer = { path = "crates/sift-indexer" }
sift-search = { path = "crates/sift-search" }

anyhow = "1.0.104"
bytemuck = "1.25"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9.11"
nucleo-matcher = "0.3.1"
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
