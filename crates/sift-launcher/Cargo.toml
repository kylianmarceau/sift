[package]
name = "sift-launcher"
description = "The sift macOS launcher (GPUI application)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The binary keeps the package name: "Sift" would collide with the
# "sift" CLI in target/release on case-insensitive APFS. The .app bundle
# renames it to Sift.
[[bin]]
name = "sift-launcher"
path = "src/main.rs"

[dependencies]
sift-core.workspace = true
sift-apps.workspace = true
sift-macos.workspace = true
sift-files.workspace = true
sift-indexer.workspace = true
sift-search.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
