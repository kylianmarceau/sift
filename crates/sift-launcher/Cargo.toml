[package]
name = "sift-launcher"
description = "The sift macOS launcher (GPUI application)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The binary keeps the package name: "Sift" would collide with the
# "sift" CLI in target/release on case-insensitive APFS. The .app bundle
# renames it to Sift.
[[bin]]
name = "sift-launcher"
path = "src/main.rs"

[dependencies]
serde.workspace = true
sift-wm.workspace = true
sift-calc.workspace = true
sift-core.workspace = true
sift-apps.workspace = true
sift-macos.workspace = true
sift-files.workspace = true
sift-indexer.workspace = true
sift-search.workspace = true
sift-state.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui.workspace = true
raw-window-handle.workspace = true
# Reads the release reply in updates.rs; already in the tree through GPUI.
serde_json = "1.0.154"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Only for examples/render_icon.rs; already in the tree through GPUI.
resvg = { version = "0.45.1", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
